dataset:
  batch_size: 48
  num_workers: 16
  align_meta_path: 'data/data_urdf/robot/align.pt'
  sources:
    - name: "original_8_hands"
      data_root: PATH_TO_TROV2_DATASET_ROOT
      object_pc_root: PATH_TO_TROV2_DATASET_OBJECT_PC_ROOT
      hand_type:
        - "ability_hand"
        - "allegro_hand"
        - "barrett_hand"
        - "dclaw_gripper"
        - "leaphand"
        - "shadow_hand"
        - "schunk_hand"
        - "xhand"
      weight: 1.0
  hand_type: 
    - "ability_hand"
    - "allegro_hand"
    - "barrett_hand"
    - "dclaw_gripper"
    - "leaphand"
    - "shadow_hand"
    - "schunk_hand"
    - "xhand"
    - "wuji_hand"
  max_links: 26
  max_joint_dim: 30
  is_mirror: False
  seed: 0

vqvae:
  vqvae_cfg:
    n_embeddings: 2048
    embedding_dim: 128
    num_point: 25
    num_dim: 128
    local_decode_pts: 20
    beta: 0.25
    use_vq: True
  object_pretrain: 'ckpt/object.ckpt'
  env_pretrain: 'ckpt/env.ckpt'

model:
  object_patch: 25
  env_patch: 25
  max_link_node: 26
  link_embed_dim: 128
  edge_embed_dim: 128
  joint_feat_dim: 128
  link_pos_dim: 128

  robot_links:
    allegro_hand: 21
    barrett_hand: 9
    shadow_hand: 22
    leaphand: 17
    xhand: 18
    ability_hand: 12
    schunk_hand: 22
    dclaw_gripper: 10
    wuji_hand: 26

  N_t_training: 5
  diffusion_config:
    scheduling: cosine
    M: 1000
    cosine_s: 0.008
    ddim_eta: 0.0
    lambda: 0.0

  denoiser_config:
    M: 1000
    t_embed_dim: 128
    V_object_dims: [3, 128]
    V_env_dims: [3, 128]
    V_robot_dims: [3, 3, 128, 128]
    E_or_dims: [3, 3]
    E_rr_dims: [3, 3, 128]
    E_er_dims: [3, 3]
    v_conv_dim: 768
    e_conv_dim: 768
    num_layers: 8
    c_atten_head: 12
    v_out_hidden_dims: [512, 256, 128]
    out_dim: [3, 3]

  inference_config: False
  embodiment:
    - "ability_hand"
    - "allegro_hand"
    - "barrett_hand"
    - "dclaw_gripper"
    - "leaphand"
    - "shadow_hand"
    - "schunk_hand"
    - "xhand"

  mode: "train"
  dtype: bf16

train:
  lr: 1e-4
  warmup_steps: 1000
  save_every: 2500
  total_steps: 1000000
  log_every: 20
  grad_clip: 1.0
  max_loss: 3.0
  save_dir: './exp/train_0.2B_eight_hands'
  project_name: 'train_0.2B_eight_hands'
  resume_from: ''
  load_optimizer: False
  mixed_precision: bf16
  accumulator: 1
